# =============================================================================
# STORM Web Platform — Production Docker Compose
# Domain: strategic-tacticaloperations.space
# Last updated: 2026-04-26
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (HTTPS / SSL Termination)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # Certbot — Let's Encrypt SSL Auto-Renewal
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # PHP 8.2 + Apache (Web Application — Internal Only)
  # ---------------------------------------------------------------------------
  web:
    build: ./php
    container_name: php_apache
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started
    env_file: .env
    environment:
      MYSQL_DATABASE: "appdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "apppass"
      DOCKER_CONTAINER: "true"
      DISCORD_BOT_API_URL: "http://bot:5000"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # MySQL 8.0 (Main Web Database)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "appdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "apppass"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database.sql:/docker-entrypoint-initdb.d/database.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=100
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # Discord Bot (Python + Internal API on port 5000)
  # ---------------------------------------------------------------------------
  bot:
    build: ./bot
    image: storm-bot:latest
    container_name: discord_bot
    restart: unless-stopped
    volumes:
      - ./bot:/app
    expose:
      - "5000"
    env_file: .env
    environment:
      PGHOST: "postgres"
      PGUSER: "botuser"
      PGPASSWORD: "botpass"
      PGDATABASE: "botdb"
      PGPORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 (Bot Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: "botuser"
      POSTGRES_PASSWORD: "botpass"
      POSTGRES_DB: "botdb"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/bot_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # Redis 7 (Cache / Session Store)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # Worker (Background Task Runner)
  # ---------------------------------------------------------------------------
  worker:
    build: ./worker
    container_name: storm_worker
    restart: unless-stopped
    volumes:
      - ./worker:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge
    name: storm_network

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  db_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
