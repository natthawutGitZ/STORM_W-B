services:
  # Nginx Reverse Proxy (HTTPS)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # PHP Apache (Internal only)
  web:
    build: ./php
    container_name: php_apache
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started
    environment:
      MYSQL_DATABASE: "appdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "apppass"
      DOCKER_CONTAINER: "true"
      DISCORD_BOT_API_URL: "http://bot:5000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "appdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "apppass"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database.sql:/docker-entrypoint-initdb.d/database.sql
    command: --default-authentication-plugin=mysql_native_password --max_connections=100
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'

  bot:
    build: ./bot
    image: storm-bot:latest
    container_name: discord_bot
    restart: unless-stopped
    volumes:
      - ./bot:/app
    expose:
      - "5000"
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_TOKEN}
      BOT_API_KEY: ${BOT_API_KEY}
      PGHOST: postgres
      PGUSER: "botuser"
      PGPASSWORD: "botpass"
      PGDATABASE: "botdb"
      PGPORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: "botuser"
      POSTGRES_PASSWORD: "botpass"
      POSTGRES_DB: "botdb"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bot/bot_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U botuser -d botdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  db_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
