# Initial config before SSL is set up
# This file is used during the first certbot run

server {
    listen 80;
    listen [::]:80;
    server_name strategic-tacticaloperations.space www.strategic-tacticaloperations.space;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporarily serve the site on HTTP until SSL is ready
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}
